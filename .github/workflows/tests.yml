name: Recovery tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '12.*', testbench: '^10.0', phpunit: '^11.5' }
          - { php: '8.3', laravel: '12.*', testbench: '^10.0', phpunit: '^11.5' }
          - { php: '8.4', laravel: '12.*', testbench: '^10.0', phpunit: '^11.5' }
          - { php: '8.5', laravel: '12.*', testbench: '^10.0', phpunit: '^11.5' }
          - { php: '8.3', laravel: '13.*', testbench: '^11.0', phpunit: '^11.5' }
          - { php: '8.4', laravel: '13.*', testbench: '^11.0', phpunit: '^11.5' }
          - { php: '8.5', laravel: '13.*', testbench: '^11.0', phpunit: '^11.5' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, sodium, zlib, mbstring, dom, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - name: Resolve the selected framework and test runner
        run: |
          composer require --dev --no-update "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}"
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies
      - name: Include optional Spatie Health integration
        if: matrix.laravel == '13.*' && matrix.php == '8.4'
        run: composer require --dev "spatie/laravel-health:^1.0" --prefer-dist --no-interaction --no-progress
      - run: composer validate --no-check-publish
      - run: composer audit --locked
      - name: Report archive and crypto runtime versions
        run: php --ri zip && php --ri sodium
      - run: composer test
